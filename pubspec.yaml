name: ssm
description: "Team base architecture boilerplate — Clean Architecture + Cubit + GetIt + Dio."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # --- State management ---
  bloc: ^9.0.0
  flutter_bloc: ^9.0.0
  equatable: ^2.0.7
  dartz: ^0.10.1

  # --- Dependency injection ---
  get_it: ^8.0.3

  # --- Networking ---
  dio: ^5.8.0+1
  connectivity_plus: ^7.0.0

  # --- Routing ---
  go_router: ^16.2.4

  # --- Storage ---
  shared_preferences: ^2.2.0
  flutter_secure_storage: ^9.0.0

  # --- Config ---
  flutter_dotenv: ^5.2.1

  # --- UI foundation ---
  flutter_screenutil: ^5.9.3
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.0.7
  cached_network_image: ^3.2.3
  shimmer: ^3.0.0
  fluttertoast: ^8.2.6
  loading_animation_widget: ^1.3.0
  photo_view: ^0.15.0

  # --- Utils ---
  intl: ^0.20.2
  logger: ^2.0.1
  url_launcher: ^6.3.1

  # --- Device ---
  geolocator: ^14.0.2
  google_maps_flutter: ^2.18.2
  image_picker: ^1.2.3

dev_dependencies:
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true

  assets:
    - .env
    - lang/
    - assets/images/
    - assets/icons/

  # Cairo, SIL OFL (see assets/fonts/OFL.txt). Static instances so every
  # FontWeight maps to a real file — family name lives in AppFonts.primary.
  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
          weight: 400
        - asset: assets/fonts/Cairo-Medium.ttf
          weight: 500
        - asset: assets/fonts/Cairo-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700
